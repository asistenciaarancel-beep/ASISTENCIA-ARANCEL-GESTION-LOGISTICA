<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Control de Asistencia</title>
<style>
:root{--bg:#eef1ec;--ink:#18222b;--mut:#5f6b73;--card:#fff;--go:#1f7a4d;--out:#b4432b;--ln:#d5dbd3}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}
main,section,header,nav{max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin:12px 0}
h1{font-size:1.5rem;margin:.2em 0 .6em}h2{font-size:1.15rem;margin:0 0 .5em}
label{display:block;font-size:.9rem;color:var(--mut);margin:10px 0}
select,input{width:100%;padding:11px;font:inherit;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink);margin-top:4px}
.b{display:block;width:100%;padding:13px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--ink);color:#fff;margin:8px 0;cursor:pointer;text-align:center}
.b:disabled{opacity:.4}.go{background:var(--go)}.out{background:var(--out)}.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.row{display:flex;gap:8px}.row>*{flex:1}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}header small{display:block;color:var(--mut)}header .b{width:auto;margin:0;padding:8px 14px}
nav{display:flex;gap:6px;overflow-x:auto}nav button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:8px;background:#fff;font:inherit;white-space:nowrap;cursor:pointer}nav .on{background:var(--ink);color:#fff}
#clk{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.s{font-size:.85rem}.err{color:var(--out)}.warn{background:#fff4d6;border:1px solid #e6c766;border-radius:8px;padding:10px;font-size:.9rem;margin:12px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
td img{width:38px;height:38px;object-fit:cover;border-radius:6px;cursor:pointer}td img.big{width:220px;height:auto}
.mo{position:fixed;inset:0;background:rgba(24,34,43,.6);overflow:auto;padding:12px}.mo .card{max-width:480px;margin:0 auto}
.logo{height:56px;width:56px;object-fit:contain;mix-blend-mode:multiply}.wm{font-weight:800;font-size:1.25rem;line-height:1}.wm small{display:block;font-weight:500;font-size:.7rem;color:var(--mut);margin-top:3px}header>div:not(.wm){flex:1;margin-left:10px}main>.wm,main>.logo{margin-bottom:6px}
video,#cv{width:100%;border-radius:8px;background:#000}.fl{text-align:center}
</style></head><body><div id="app"></div>

async function putUser(u){if(db)await db.collection('usuarios').doc(u.id).set(u);const i=USERS.findIndex(x=>x.id===u.id);i<0?USERS.push(u):USERS[i]=u;keep();refreshC()}
async function delUser(id){if(db)await db.collection('usuarios').doc(id).delete();USERS=USERS.filter(u=>u.id!==id);keep();refreshC()}
async function putSedes(){if(db)await db.doc('config/sedes').set({list:SEDES});keep();refreshC()}
function login(){clearInterval(clk);
$('#app').innerHTML=`<main class="card">${logo()}<h1>Control de Asistencia</h1>${dberr?'<p class="err">No se pudo conectar con la base de datos. Revisa tu conexión o la configuración de Firebase.</p>':!FIREBASE_CONFIG.apiKey?'<div class="warn">Modo demostración: los registros se guardan solo en este dispositivo.</div>':''}
<label>Sede<select id="ci" onchange="fillNames()"><option value="">Todas</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select></label>
<label>Selecciona tu nombre<select id="nm"></select></label>
<label>Contraseña (tu cédula)<input id="pw" type="password" inputmode="numeric" autocomplete="off"></label>
<button class="b go" onclick="doLogin()">Ingresar</button><p id="err" class="err"></p></main>`;fillNames()}
function fillNames(){const c=$('#ci').value;$('#nm').innerHTML='<option value="">— Elige tu nombre —</option>'+USERS.map((u,i)=>[u,i]).filter(([u])=>!c||u.c===c).sort((a,b)=>a[0].n.localeCompare(b[0].n)).map(([u,i])=>`<option value="${i}">${esc(u.n)}</option>`).join('')}
function doLogin(){const u=USERS[$('#nm').value];if(u&&u.id===$('#pw').value.trim()){me=u;main()}else $('#err').textContent='Nombre o contraseña incorrectos.'}
function main(){const adm=me.r>0;
$('#app').innerHTML=`<header>${logo()}<div><b>${esc(me.n)}</b><small>${esc(me.c)}${adm?' · Administrador':''}</small></div><button class="b ghost" onclick="login()">Salir</button></header>
<nav><button id="t-mark" onclick="tabTo('mark')">Registrar</button><button id="t-mine" onclick="tabTo('mine')">Mis registros</button>${adm?`<button id="t-reg" onclick="tabTo('reg')">Panel de revisión</button><button id="t-sum" onclick="tabTo('sum')">Resumen</button><button id="t-usr" onclick="tabTo('usr')">Usuarios</button>`:''}</nav><section id="v"></section>`;tabTo('mark')}
async function tabTo(t){clearInterval(clk);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='t-'+t));
const v=$('#v');v.innerHTML='<p class="mut">Cargando…</p>';
try{ALL=await getRecs()}catch(e){v.innerHTML='<p class="err">No se pudieron cargar los registros.</p>';return}
if(t==='mark')return markView();
if(t==='mine'){const l=Date.now()-30*864e5;v.innerHTML=`<div class="card"><h2>Mis registros</h2><p class="mut s">Historial de los últimos 30 días. Solo lectura.</p>${tbl(ALL.filter(r=>r.id===me.id&&r.ts>l),0)}</div>`;return}
if(t==='usr')return usrView();adminView(t)}
function markView(){const rs=ALL.filter(r=>r.id===me.id&&day(r.ts)===day(Date.now())).sort((a,b)=>b.ts-a.ts),last=rs[0],open=last&&last.tipo==='entrada';
$('#v').innerHTML=`<div class="card"><div id="clk"></div><p class="mut">${last?'Último registro de hoy: '+last.tipo+', '+fmt(last.ts):'Hoy aún no has marcado.'}</p>
<button class="b go" ${open?'disabled':''} onclick="openMark('entrada')">Marcar entrada</button>
<button class="b out" ${open?'':'disabled'} onclick="openMark('salida')">Marcar salida</button>
<p class="mut s">Al marcar se toma una foto con marca de agua (nombre, tipo y hora). Para la salida debes indicar una novedad.</p></div>`;
const k=()=>$('#clk')&&($('#clk').textContent=new Date().toLocaleTimeString('es-CO'));k();clk=setInterval(k,1000)}
const PAR=()=>{const by={},p={};ALL.slice().sort((a,b)=>a.ts-b.ts).forEach(r=>{if(r.tipo==='entrada')by[r.id]=r;else if(by[r.id]){p[r.id+'|'+r.ts]=r.ts-by[r.id].ts;by[r.id]=null}});return p};
const hh=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const hv=(P,r)=>r.tipo==='salida'?P[r.id+'|'+r.ts]:undefined;
const tbl=(rs,w)=>{const P=PAR();let tot=0;rs.forEach(r=>{const v=hv(P,r);if(v)tot+=v});return rs.length?`<p class="s"><b>Total horas trabajadas: ${hh(tot)}</b></p><div class="sc"><table><tr><th>Fecha</th>${w?'<th>Trabajador</th><th>Sede</th>':''}<th>Tipo</th><th>Horas</th><th>Novedad</th><th>Foto</th></tr>${rs.map(r=>`<tr><td>${fmt(r.ts)}</td>${w?`<td>${esc(r.n)}</td><td>${esc(r.c)}</td>`:''}<td>${r.tipo}</td><td>${hv(P,r)!=null?hh(hv(P,r)):''}</td><td>${esc(r.nov)}${r.txt?': '+esc(r.txt):''}</td><td>${r.foto?`<img src="${r.foto}" onclick="this.classList.toggle('big')">`:''}</td></tr>`).join('')}</table></div>`:'<p class="mut">Aún no hay registros.</p>'};
const rowsF=()=>ALL.filter(r=>(!fc||r.c===fc)&&(!fd||day(r.ts)>=fd));
function adminView(t){tab=t;const rs=rowsF();let body;
if(t==='reg')body=`<button class="b ghost" onclick="dl()">Descargar Excel (CSV)</button>${tbl(rs,1)}`;
else{const m={};USERS.filter(u=>!fc||u.c===fc).forEach(u=>m[u.id]={n:u.n,c:u.c,e:0,s:0,d:new Set(),b:0,nv:0,h:0});
const P=PAR();rs.forEach(r=>{const x=m[r.id];if(!x)return;const v=hv(P,r);if(v)x.h+=v;r.tipo==='entrada'?x.e++:x.s++;x.d.add(day(r.ts));if((r.nov||'').startsWith('Bono'))x.b++;if(r.nov==='Novedad')x.nv++});
body=`<div class="sc"><table><tr><th>Trabajador</th><th>Sede</th><th>Días</th><th>Entradas</th><th>Salidas</th><th>Horas</th><th>Bonos</th><th>Novedades</th></tr>${Object.values(m).sort((a,b)=>b.d.size-a.d.size).map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.c)}</td><td>${x.d.size}</td><td>${x.e}</td><td>${x.s}</td><td>${hh(x.h)}</td><td>${x.b}</td><td>${x.nv}</td></tr>`).join('')}</table></div>`}
$('#v').innerHTML=`<div class="card"><h2>${t==='reg'?'Registros del equipo':'Resumen por trabajador'}</h2><div class="row"><select id="fc" onchange="fc=this.value;adminView(tab)"><option value="">Todas las sedes</option>${CITIES.map(c=>`<option ${c===fc?'selected':''}>${c}</option>`).join('')}</select><input type="date" id="fd" value="${fd}" onchange="fd=this.value;adminView(tab)"></div>${body}</div>`}
let tab='reg';
async function dl(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const csv='\ufeffFecha,Hora,Trabajador,Cédula,Sede,Tipo,Horas,Novedad,Detalle\n'+(()=>{const P=PAR();return rowsF().map(r=>[day(r.ts),new Date(r.ts).toLocaleTimeString('es-CO'),r.n,r.id,r.c,r.tipo,hv(P,r)!=null?(hv(P,r)/36e5).toFixed(2):'',r.nov,r.txt].map(q).join(',')).join('\n')})();const nm='asistencia_'+day(Date.now())+'.csv',bl=new Blob([csv],{type:'text/csv'});let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}if(d){try{await d.save({filename:nm,data:bl})}catch(e){}return}const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=nm;a.click()}

let uq='';
const opts=(a,s)=>a.map(c=>`<option ${c===s?'selected':''}>${esc(c)}</option>`).join('');
function usrView(){const g=me.r===2,can=u=>g||u.r===0;
const l=USERS.filter(u=>(!fc||u.c===fc)&&(!uq||(u.n+u.id).toLowerCase().includes(uq))).sort((a,b)=>a.n.localeCompare(b.n));
$('#v').innerHTML=`<div class="card"><h2>Agregar trabajador</h2>
<label>Nombre completo<input id="un"></label><label>Cédula (será su contraseña)<input id="ui" inputmode="numeric"></label>
<label>Sede<select id="uc">${opts(CITIES,fc)}</select></label>
${g?`<label>Rol<select id="ur"><option value="0">Trabajador</option><option value="1">Administrador</option></select></label>`:''}
<button class="b go" onclick="addUser()">Agregar usuario</button><p id="ue" class="err"></p></div>
${g?`<div class="card"><h2>Nueva sede</h2><input id="ns" placeholder="Nombre de la sede"><button class="b" onclick="addSede()">Crear sede</button></div>`:''}
<div class="card"><h2>Usuarios activos (${l.length})</h2><div class="row"><select onchange="fc=this.value;usrView()"><option value="">Todas las sedes</option>${opts(CITIES,fc)}</select><input placeholder="Buscar nombre o cédula" value="${esc(uq)}" onchange="uq=this.value.toLowerCase();usrView()"></div>
<div class="sc"><table><tr><th>Nombre</th><th>Cédula</th><th>Sede</th><th></th></tr>${l.map(u=>`<tr><td>${esc(u.n)}${u.r?` <small class="mut">${u.r===2?'Admin global':'Admin'}</small>`:''}</td><td>${esc(u.id)}</td><td>${can(u)?`<select onchange="moveUser('${u.id}',this.value)">${opts(CITIES,u.c)}</select>`:esc(u.c)}</td><td>${can(u)&&u.id!==me.id?`<button class="b ghost" style="padding:6px 10px;margin:0" onclick="rmUser('${u.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div></div>`}
async function addUser(){const n=$('#un').value.replace(/\s+/g,' ').trim(),id=$('#ui').value.replace(/\D/g,''),c=$('#uc').value,r=me.r===2?+$('#ur').value:0,e=$('#ue');
if(!n||!id||!c)return e.textContent='Completa nombre, cédula y sede.';if(USERS.some(u=>u.id===id))return e.textContent='Esa cédula ya está registrada.';
try{await putUser({id,n,c,r});usrView()}catch(x){e.textContent='No se pudo guardar. Revisa tu conexión.'}}
async function moveUser(id,c){const u=USERS.find(x=>x.id===id);try{await putUser({...u,c})}catch(x){alert('No se pudo cambiar la sede.')}usrView()}
async function rmUser(id){const u=USERS.find(x=>x.id===id);if(!confirm('¿Eliminar a '+u.n+'? Sus registros anteriores se conservan.'))return;try{await delUser(id)}catch(x){alert('No se pudo eliminar.')}usrView()}
async function addSede(){const n=$('#ns').value.replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
if(!n)return;if(CITIES.some(c=>c.toLowerCase()===n.toLowerCase()))return alert('Esa sede ya existe.');SEDES.push(n);try{await putSedes();usrView()}catch(x){SEDES.pop();alert('No se pudo crear la sede.')}}
function openMark(tipo){st={tipo,foto:null};const m=document.createElement('div');m.id='mo';m.className='mo';
m.innerHTML=`<div class="card"><h2>Marcar ${tipo}</h2>${tipo==='salida'?`<label>Novedad de salida (obligatorio)<select id="nv" onchange="$('#tx').hidden=this.value!=='Novedad'"><option value="">— Elige —</option><option>Sin novedad</option><option>Bono Tercer viaje</option><option>Bono Nocturno</option><option>Bono cena</option><option>Novedad</option></select></label><input id="tx" maxlength="50" placeholder="Describe la novedad (máx. 50 caracteres)" hidden>`:''}
<video id="vd" autoplay playsinline muted></video><canvas id="cv" hidden></canvas>
<div class="row"><button class="b" onclick="snap()">Tomar foto</button><button class="b ghost" id="rt" onclick="retake()" hidden>Repetir</button></div>
<label class="b ghost fl">Subir foto<input type="file" accept="image/*" capture="user" hidden onchange="fromFile(this)"></label><p id="me" class="err"></p>
<div class="row"><button class="b ghost" onclick="closeMark()">Cancelar</button><button class="b go" id="sv" onclick="saveMark()" disabled>Guardar registro</button></div></div>`;
document.body.appendChild(m);startCam()}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('#vd').srcObject=stream}catch(e){$('#me').textContent='No hay acceso a la cámara. Usa «Subir foto».'}}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
function draw(src,w,h){const c=$('#cv'),s=480/w;c.width=480;c.height=Math.round(h*s);const x=c.getContext('2d');x.drawImage(src,0,0,c.width,c.height);
x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-62,c.width,62);x.fillStyle='#fff';x.font='bold 15px sans-serif';
[me.n,st.tipo[0].toUpperCase()+st.tipo.slice(1)+' · '+me.c,new Date().toLocaleString('es-CO')].forEach((l,i)=>x.fillText(l,10,c.height-42+i*19));
st.foto=c.toDataURL('image/jpeg',.6);c.hidden=false;$('#vd').hidden=true;$('#rt').hidden=false;$('#sv').disabled=false}
function snap(){const v=$('#vd');if(v.videoWidth)draw(v,v.videoWidth,v.videoHeight)}
function fromFile(i){const f=i.files[0];f&&createImageBitmap(f).then(b=>draw(b,b.width,b.height))}
function retake(){st.foto=null;$('#cv').hidden=true;$('#vd').hidden=false;$('#rt').hidden=true;$('#sv').disabled=true;if(!stream)startCam()}
function closeMark(){stopCam();$('#mo').remove()}
async function saveMark(){let nov='',txt='';
if(st.tipo==='salida'){nov=$('#nv').value;txt=$('#tx').value.trim();if(!nov)return $('#me').textContent='Elige la novedad de salida.';if(nov==='Novedad'&&!txt)return $('#me').textContent='Describe la novedad.'}
$('#sv').disabled=true;try{await saveRec({id:me.id,n:me.n,c:me.c,tipo:st.tipo,ts:Date.now(),nov,txt,foto:st.foto});closeMark();tabTo('mark')}catch(e){$('#me').textContent='No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';$('#sv').disabled=false}}
initStore().then(loadUsers).catch(()=>{dberr=true;refreshC()}).then(login);
</script></body></html>
